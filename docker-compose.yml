services:
  game-archive:
    build: .
    container_name: game-archive
    restart: unless-stopped
    ports:
      - "8080:8000"
    dns: [192.168.20.1, 223.5.5.5]
    extra_hosts: ["api.rawg.io:104.16.249.144"]
    environment:
      - TZ=Asia/Shanghai
      - SCAN_ENABLE=true
      - SCAN_CRON=0 3 * * *
      - SCAN_THROTTLE_MS=50
      - SCAN_WEEKLY_FULL_CHECK=false
      - RAWG_API_KEY=***REMOVED-RAWG-API-KEY***
    volumes:
      # 修改左侧为飞牛本地存储中的实际目录。
      - /vol1/1000/docker/game-archive/data:/app/data
      # 可选：飞牛 WebDAV 挂载百度网盘的宿主路径。
      - /vol02/1000-1-dd21201d/game_station:/vol/baidu
      # 本地游戏目录。
      - /vol1/1000/docker/game-archive/games:/vol/games
      # 云盘游戏转存到 NAS 本地的目标目录。
      - /vol1/1000/docker/game-archive/downloads:/vol/download