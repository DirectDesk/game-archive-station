services:
  game-archive:
    build: .
    container_name: game-archive
    restart: unless-stopped
    ports:
      - "8080:8000"
    # 显式使用纯 IPv4 公共 DNS：宿主机 systemd-resolved 的 IPv6 nameserver 无路由会超时，
    # 导致容器内域名解析间歇性失败（[Errno -3] Try again）。公共 DNS 经 dig 验证可用。
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 114.114.114.114
    dns_opt:
      - timeout:1
      - attempts:3
      - single-request-reopen
    environment:
      - TZ=Asia/Shanghai
      - SCAN_ENABLE=true
      - SCAN_CRON=0 3 * * *
      - SCAN_THROTTLE_MS=50
      - SCAN_WEEKLY_FULL_CHECK=false
      # RAWG API Key 从同目录 .env 读取（.env 不入库；见 .env.example）
      - RAWG_API_KEY=${RAWG_API_KEY:-}
      # 多线程下载引擎（见 backend/app/download_engine.py）：
      # 挂载源（/vol/baidu）走「分段并发直读」，FUSE_THREADS 控制并发（4~8 最佳）。
      # ARIA_* 仅在「有直链的云端网盘」时用到；secret 从同目录 .env 读取（不入库）。
      - FUSE_THREADS=${FUSE_THREADS:-8}
      - ARIA_RPC=${ARIA_RPC:-http://192.168.20.10:6800/jsonrpc}
      - ARIA_SECRET=${ARIA_SECRET:-}
    volumes:
      # 修改左侧为飞牛本地存储中的实际目录。
      - /vol1/1000/docker/game-archive/data:/app/data
      # 可选：飞牛 WebDAV 挂载百度网盘的宿主路径。
      - /vol02/1000-1-dd21201d/game_station:/vol/baidu
      # 本地游戏目录。
      - /vol1/1000/docker/game-archive/games:/vol/games
      # 云盘游戏转存到 NAS 本地的目标目录。
      - /vol1/1000/docker/game-archive/downloads:/vol/download
      # 前端构建产物直接挂载：改前端只需重新构建 dist 并上传，无需重建镜像
      # （镜像内 COPY 的 dist 会被此挂载覆盖，避免 Docker 层缓存导致前端不更新）。
      - /vol1/1000/docker/game-archive/frontend/dist:/app/frontend/dist:ro